<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sudoku 9x9 - Offline Game</title>
  <meta name="description" content="Offline 9x9 Sudoku game with medium complexity, pencil notes, and mobile-friendly touch controls.">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M9 3v18M15 3v18M3 9h18M3 15h18" />
          </svg>
          <h1>Sudoku</h1>
        </div>
        <span class="offline-badge" title="100% Offline Capable">Offline</span>
      </div>

      <div class="header-right">
        <!-- Difficulty Selector -->
        <div class="select-wrapper">
          <select id="difficulty-select" aria-label="Select Difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <!-- Theme Toggle -->
        <button id="theme-toggle" class="icon-button" aria-label="Toggle Theme" title="Toggle Theme">
          <svg id="theme-icon-sun" class="icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg id="theme-icon-moon" class="icon hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- New Game Button -->
        <button id="btn-new-game" class="btn btn-primary" title="Start a fresh game">
          New Game
        </button>
      </div>
    </header>

    <!-- Game Status Bar (Mistakes & Timer) -->
    <div class="status-bar">
      <div class="status-item">
        <span class="status-label">Difficulty:</span>
        <span id="display-difficulty" class="status-value">Medium</span>
      </div>
      <div class="status-item">
        <span class="status-label">Mistakes:</span>
        <span id="display-mistakes" class="status-value">0</span>
      </div>
      <div class="status-item timer-wrapper">
        <span class="status-label">Time:</span>
        <span id="timer-display" class="status-value font-mono">00:00</span>
        <button id="btn-pause" class="icon-button-small" aria-label="Pause/Resume Game" title="Pause or Resume">
          <svg id="icon-pause" class="icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
          <svg id="icon-play" class="icon hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <!-- Main Game Area with Board -->
    <main class="game-area">
      <div class="board-wrapper">
        <div id="sudoku-grid" class="sudoku-grid" role="grid" aria-label="Sudoku 9x9 Grid">
          <!-- 81 cells will be rendered by app.js -->
        </div>

        <!-- Pause Overlay -->
        <div id="pause-overlay" class="pause-overlay hidden">
          <div class="pause-content">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
            </svg>
            <h2>Game Paused</h2>
            <button id="btn-resume-overlay" class="btn btn-primary">Resume</button>
          </div>
        </div>
      </div>

      <!-- Action Toolbar (Undo, Erase, Notes, Hint) -->
      <section class="toolbar" aria-label="Sudoku Controls">
        <button id="btn-undo" class="tool-btn" title="Undo last move (Ctrl+Z / U)">
          <div class="tool-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 7v6h6"></path>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
            </svg>
          </div>
          <span class="tool-label">Undo</span>
        </button>

        <button id="btn-erase" class="tool-btn" title="Erase cell (Backspace / Del)">
          <div class="tool-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"></path>
            </svg>
          </div>
          <span class="tool-label">Erase</span>
        </button>

        <button id="btn-notes" class="tool-btn" title="Toggle candidate pencil notes (N)">
          <div class="tool-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span id="notes-badge" class="badge-pill">OFF</span>
          </div>
          <span class="tool-label">Notes</span>
        </button>

        <button id="btn-hint" class="tool-btn" title="Reveal correct number for selected cell (H)">
          <div class="tool-icon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18h6"></path>
              <path d="M10 22h4"></path>
              <path d="M12 2a7 7 0 0 0-7 7c0 2.5 1.5 4.5 3 6h8c1.5-1.5 3-3.5 3-6a7 7 0 0 0-7-7z"></path>
            </svg>
          </div>
          <span class="tool-label">Hint</span>
        </button>
      </section>

      <!-- On-Screen Touch Numpad (1 to 9) -->
      <section class="numpad" aria-label="Number Input Pad">
        <!-- 9 digit buttons dynamically managed by app.js -->
        <button class="num-key" data-digit="1"><span class="digit">1</span><span class="count-badge" id="count-1"></span></button>
        <button class="num-key" data-digit="2"><span class="digit">2</span><span class="count-badge" id="count-2"></span></button>
        <button class="num-key" data-digit="3"><span class="digit">3</span><span class="count-badge" id="count-3"></span></button>
        <button class="num-key" data-digit="4"><span class="digit">4</span><span class="count-badge" id="count-4"></span></button>
        <button class="num-key" data-digit="5"><span class="digit">5</span><span class="count-badge" id="count-5"></span></button>
        <button class="num-key" data-digit="6"><span class="digit">6</span><span class="count-badge" id="count-6"></span></button>
        <button class="num-key" data-digit="7"><span class="digit">7</span><span class="count-badge" id="count-7"></span></button>
        <button class="num-key" data-digit="8"><span class="digit">8</span><span class="count-badge" id="count-8"></span></button>
        <button class="num-key" data-digit="9"><span class="digit">9</span><span class="count-badge" id="count-9"></span></button>
      </section>
    </main>

    <!-- Victory Modal -->
    <div id="win-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="modal-card">
        <div class="confetti-icon">🎉</div>
        <h2 id="win-title">Puzzle Solved!</h2>
        <p class="win-subtitle">Congratulations, you conquered this puzzle!</p>

        <div class="win-stats">
          <div class="win-stat-box">
            <span class="win-stat-label">Time</span>
            <span id="win-time" class="win-stat-val">00:00</span>
          </div>
          <div class="win-stat-box">
            <span class="win-stat-label">Difficulty</span>
            <span id="win-diff" class="win-stat-val">Medium</span>
          </div>
          <div class="win-stat-box">
            <span class="win-stat-label">Mistakes</span>
            <span id="win-mistakes" class="win-stat-val">0</span>
          </div>
        </div>

        <div class="modal-actions">
          <button id="btn-win-new" class="btn btn-primary btn-block">Play New Game</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./sudoku-engine.js"></script>
  <script src="./app.js"></script>
</body>
</html>
